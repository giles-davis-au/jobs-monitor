# Companies to monitor. Add a new one by adding an entry here — no code
# changes needed for greenhouse / lever / ashby / workable / employmenthero /
# attrax companies (see docs/PLAN.md §2-3 for how each connector type works
# and how to find the right config values for a new company on that platform).
#
# `homepage` is the company's public marketing site (not its careers page) —
# used for the "Company" hyperlink in the GSheet log, kept separate from
# connector config since it's just metadata, not fetch behaviour.

- name: Block
  homepage: https://block.xyz
  connector: greenhouse
  config:
    board_token: block

- name: Deputy
  homepage: https://www.deputy.com
  connector: lever
  config:
    slug: deputy

